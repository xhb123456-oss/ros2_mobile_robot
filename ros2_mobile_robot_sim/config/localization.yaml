# Official AMCL with this simulation's frame names and laser limits.
map_server:
  ros__parameters:
    use_sim_time: true
    frame_id: map
    topic_name: map

amcl:
  ros__parameters:
    use_sim_time: true
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_footprint
    scan_topic: /scan
    map_topic: /map
    robot_model_type: nav2_amcl::DifferentialMotionModel
    laser_model_type: likelihood_field
    laser_min_range: 0.12
    laser_max_range: 8.0
    max_beams: 60
    min_particles: 500
    max_particles: 2000
    update_min_d: 0.1
    update_min_a: 0.1
    tf_broadcast: true
    transform_tolerance: 1.0
    # This launch restarts the SAME world with the robot at (0, 0, yaw=0).
    # This is a known initial estimate, not global localization from an unknown pose.
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
