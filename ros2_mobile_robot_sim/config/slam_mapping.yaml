# Overrides on top of the installed SLAM Toolbox online-async defaults.
# All distances are metres, angles radians, and times simulation seconds.
slam_toolbox:
  ros__parameters:
    use_sim_time: true
    mode: mapping
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    resolution: 0.05
    min_laser_range: 0.12
    max_laser_range: 8.0
    map_update_interval: 2.0
    minimum_time_interval: 0.1
    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.1
    transform_publish_period: 0.02
    transform_timeout: 0.2
